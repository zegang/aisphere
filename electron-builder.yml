appId: io.aisphere
productName: aisphere
copyright: Copyright © 2026 AiSphere

# node-pty ships Node-API prebuilds for every supported platform. Rebuilding
# them with node-gyp is unnecessary and fails on machines without a C++ toolchain.
npmRebuild: false

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
      - "!icons/**/*"
  # Tray icon (the window/exe icon is embedded by electron-builder instead).
  - from: resources/icons/icon.png
    to: icons/icon.png

win:
  icon: resources/icons/icon.png
  target:
    - target: nsis
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  menuCategory: true
  shortcutName: AiSphere
  createDesktopShortcut: true
  include: resources/scripts/win/installer.nsh

mac:
  icon: resources/icons
  category: public.app-category.developer-tools
  entitlementsInherit: null
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  icon: resources/icons/icon.jpeg
  category: Utility
  executableName: aisphere
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  desktop:
    Name: AiSphere
    Commnet: AI under your control

deb:
  afterInstall: resources/scripts/linux/after_install.sh
  afterRemove: resources/scripts/linux/after_remove.sh

publish: null
